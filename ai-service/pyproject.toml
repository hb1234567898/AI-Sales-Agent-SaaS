[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-sales-agent-ai"
version = "0.1.0"
description = "FastAPI and LangChain model orchestration service for AI Sales Agent"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
