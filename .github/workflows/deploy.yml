name: Deploy release

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub deployment environment
        required: true
        type: string
      artifact_name:
        description: Release artifact generated by the caller
        required: true
        type: string
      release_sha:
        description: Commit SHA used as the release identifier
        required: true
        type: string
    secrets:
      DEPLOY_HOST:
        required: true
      DEPLOY_PORT:
        required: false
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: package

      - name: Verify release checksum
        working-directory: package
        run: sha256sum --check sales-agent-*.tar.gz.sha256

      - name: Configure deployment SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload release archive and deployment script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          port="${DEPLOY_PORT:-22}"
          archive="$(find package -maxdepth 1 -type f -name 'sales-agent-*.tar.gz' -print -quit)"
          test -n "$archive"
          remote_archive="/tmp/sales-agent-${RELEASE_SHA}.tar.gz"
          deploy_script="$RUNNER_TEMP/deploy-sales-agent-${RELEASE_SHA}.sh"
          remote_deploy_script="/tmp/deploy-sales-agent-${RELEASE_SHA}.sh"
          tar -xOf "$archive" ./deploy/deploy-sales-agent.sh > "$deploy_script"
          test -s "$deploy_script"
          chmod 700 "$deploy_script"
          scp -P "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$archive" "root@$DEPLOY_HOST:$remote_archive"
          scp -P "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$deploy_script" "root@$DEPLOY_HOST:$remote_deploy_script"
          printf '%s' "$remote_archive" > "$RUNNER_TEMP/remote-archive"
          printf '%s' "$remote_deploy_script" > "$RUNNER_TEMP/remote-deploy-script"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          port="${DEPLOY_PORT:-22}"
          remote_archive="$(cat "$RUNNER_TEMP/remote-archive")"
          remote_deploy_script="$(cat "$RUNNER_TEMP/remote-deploy-script")"
          ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST" \
            "install -o root -g root -m 0755 '$remote_deploy_script' /usr/local/sbin/deploy-sales-agent && rm -f '$remote_deploy_script' && /usr/local/sbin/deploy-sales-agent '$remote_archive' '$RELEASE_SHA'"

      - name: Remove temporary SSH identity
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
