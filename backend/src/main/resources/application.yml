spring:
  application:
    name: sales-agent
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_sales_agent}}
    username: ${DB_USER:${POSTGRES_USER:ai_sales_agent}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:change-me}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    time-zone: UTC
  ai:
    # 模型客户端按数据库中的组织配置动态创建，后端启动时不再读取 API Key。
    model:
      chat: none
      embedding: none

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.yourcompany.salesagent.shared.persistence
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: ${spring.application.name}
    description: AI Sales Follow-up Agent API

app:
  auth:
    access-token-duration: ${AUTH_ACCESS_TOKEN_DURATION:PT15M}
    session-duration: ${AUTH_SESSION_DURATION:PT12H}
    remember-duration: ${AUTH_REMEMBER_DURATION:P30D}
    jwt-issuer: ${AUTH_JWT_ISSUER:ai-sales-agent}
    jwt-signing-key: ${AUTH_JWT_SIGNING_KEY:}
  ai:
    qwen:
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${QWEN_MODEL:qwen-plus}
  security:
    secrets:
      encryption-key: ${APP_ENCRYPTION_KEY:}
  demo:
    # 登录与租户解析完成前使用的开发租户；正式环境应关闭演示数据初始化。
    organization-id: ${DEMO_ORGANIZATION_ID:00000000-0000-0000-0000-000000000001}
    seed-enabled: ${DEMO_SEED_ENABLED:true}
    login-password: ${DEMO_LOGIN_PASSWORD:Demo@123456}
